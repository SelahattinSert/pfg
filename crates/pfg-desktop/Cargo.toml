[package]
name = "pfg-desktop"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[[bin]]
name = "pfg-desktop"
path = "src/main.rs"

[dependencies]
pfg-core = { path = "../pfg-core" }
pfg-model = { path = "../pfg-model" }
pfg-policy = { path = "../pfg-policy" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = "2"

[build-dependencies]
tauri-build = "2"

