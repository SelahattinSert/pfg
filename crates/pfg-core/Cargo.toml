[package]
name = "pfg-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
pfg-model = { path = "../pfg-model" }
pfg-policy = { path = "../pfg-policy" }
pfg-format-image = { path = "../pfg-format-image" }
pfg-format-pdf = { path = "../pfg-format-pdf" }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
uuid = { version = "1.4", features = ["v4"] }

[dev-dependencies]
lopdf = "0.31"

